<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Solid black background with no border radius -->
  <rect width="64" height="64" fill="#000000"/>

  <!-- Beefy "1" design -->
  <g transform="translate(18, 10)">
    <!-- Main thick vertical bar -->
    <rect x="8" y="0" width="16" height="44" fill="#26a269"/>

    <!-- Top diagonal stroke -->
